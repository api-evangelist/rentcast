        - name: lookupSubjectAttributes
          in: query
          type: boolean
          description: When enabled, will attempt to look up subject property attributes to find more relevant comps. Defaults
            to `true` if not provided. [Learn more](https://develope
    - name: listings-rental-long-term
      path: /listings/rental/long-term
      operations:
      - name: rentallistingslongterm
        method: GET
        description: Rental Listings
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: address
          in: query
          type: string
          description: The **full address** of the property, in the format `Street, City, State, Zip`. Used to retrieve data
            for a specific property, or together with the `radius` par
        - name: city
          in: query
          type: string
          description: The name of the city, used to search for listings in a specific city. This parameter is case-sensitive
        - name: state
          in: query
          type: string
          description: The 2-character state abbreviation, used to search for listings in a specific state. This parameter
            is case-sensitive
        - name: zipCode
          in: query
          type: string
          description: The 5-digit zip code, used to search for listings in a specific zip code
        - name: latitude
          in: query
          type: number
          description: The latitude of the search area. Use the `latitude`/`longitude` and `radius` parameters to search for
            listings in a circular area
        - name: longitude
          in: query
          type: number
          description: The longitude of the search area. Use the `latitude`/`longitude` and `radius` parameters to search
            for listings in a circular area
        - name: radius
          in: query
          type: number
          description: The radius of the search area in miles, with a maximum of 100. Use in combination with the `latitude`/`longitude`
            or `address` parameters to search for listings
        - name: propertyType
          in: query
          type: string
          description: The type of the property, used to search for listings matching this criteria. See [explanation of property
