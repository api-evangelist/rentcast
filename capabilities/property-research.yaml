naftiko: 1.0.0-alpha2
info:
  label: RentCast Property Research
  description: Unified workflow for real estate property research, market analysis, and investment evaluation using the RentCast
    API. Combines property record lookup, rent and home value estimation, listing search, and market statistics to support
    real estate investors, landlords, property managers, and proptech applications.
  tags:
  - Real Estate
  - Property Data
  - Valuation
  - Investment
  - Market Analysis
  created: '2026-05-02'
  modified: '2026-05-06'
binds:
- namespace: env
  keys:
    RENTCAST_API_KEY: RENTCAST_API_KEY
capability:
  consumes:
  - type: http
    namespace: rentcast
    baseUri: https://api.rentcast.io/v1
    description: RentCast real estate data API
    authentication:
      type: apikey
      key: X-Api-Key
      value: '{{RENTCAST_API_KEY}}'
      placement: header
    resources:
    - name: properties
      path: /properties
      description: US property records
      operations:
      - name: search-properties
        method: GET
        description: Search for property records by address or geographic area
        inputParameters:
        - name: address
          in: query
          type: string
          required: false
          description: Full property address
        - name: city
          in: query
          type: string
          required: false
          description: City name
        - name: state
          in: query
          type: string
          required: false
          description: 2-character state code
        - name: zipCode
          in: query
          type: string
          required: false
          description: 5-digit ZIP code
        - name: latitude
          in: query
          type: string
          required: false
          description: Latitude for circular search
        - name: longitude
          in: query
          type: string
          required: false
          description: Longitude for circular search
        - name: radius
          in: query
          type: string
          required: false
          description: Search radius in miles
        - name: propertyType
          in: query
          type: string
          required: false
          description: Property type filter
        - name: limit
          in: query
          type: integer
          required: false
          description: Results per page (1-500)
        - name: offset
          in: query
          type: integer
          required: false
          description: Pagination offset
        outputRawFormat: json
        outputParameters:
        - name: result
          type: array
          value: $.
      - name: get-property
        method: GET
        description: Get a single property record by ID
        inputParameters:
        - name: id
          in: path
          type: string
          required: true
          description: RentCast property ID
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: rent-estimate
      path: /avm/rent/long-term
      description: Automated rent estimate for a property
      operations:
      - name: get-rent-estimate
        method: GET
        description: Get a rent estimate with comparables for a property
        inputParameters:
        - name: address
          in: query
          type: string
          required: false
          description: Full property address
        - name: latitude
          in: query
          type: string
          required: false
          description: Property latitude
        - name: longitude
          in: query
          type: string
          required: false
          description: Property longitude
        - name: propertyType
          in: query
          type: string
          required: false
          description: Property type
        - name: bedrooms
          in: query
          type: string
          required: false
          description: Number of bedrooms
        - name: bathrooms
          in: query
          type: string
          required: false
          description: Number of bathrooms
        - name: squareFootage
          in: query
          type: string
          required: false
          description: Living area in square feet
        - name: compCount
          in: query
          type: integer
          required: false
          description: Number of comparables (5-25)
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: value-estimate
      path: /avm/value
      description: Automated home value estimate for a property
      operations:
      - name: get-value-estimate
        method: GET
        description: Get a home value estimate with comparables for a property
        inputParameters:
        - name: address
          in: query
          type: string
          required: false
          description: Full property address
        - name: latitude
          in: query
          type: string
          required: false
          description: Property latitude
        - name: longitude
          in: query
          type: string
          required: false
          description: Property longitude
        - name: propertyType
          in: query
          type: string
          required: false
          description: Property type
        - name: bedrooms
          in: query
          type: string
          required: false
          description: Number of bedrooms
        - name: bathrooms
          in: query
          type: string
          required: false
          description: Number of bathrooms
        - name: squareFootage
          in: query
          type: string
          required: false
          description: Living area in square feet
        - name: compCount
          in: query
          type: integer
          required: false
          description: Number of comparables (5-25)
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: sale-listings
      path: /listings/sale
      description: Sale listings in the US
      operations:
      - name: search-sale-listings
        method: GET
        description: Search for sale listings by location or address
        inputParameters:
        - name: address
          in: query
          type: string
          required: false
          description: Full property address
        - name: city
          in: query
          type: string
          required: false
          description: City name
        - name: state
          in: query
          type: string
          required: false
          description: State code
        - name: zipCode
          in: query
          type: string
          required: false
          description: ZIP code
        - name: propertyType
          in: query
          type: string
          required: false
          description: Property type filter
        - name: status
          in: query
          type: string
          required: false
          description: Listing status (Active or Inactive)
        - name: limit
          in: query
          type: integer
          required: false
          description: Results per page
        outputRawFormat: json
        outputParameters:
        - name: result
          type: array
          value: $.
    - name: rental-listings
      path: /listings/rental/long-term
      description: Long-term rental listings in the US
      operations:
      - name: search-rental-listings
        method: GET
        description: Search for rental listings by location or address
        inputParameters:
        - name: address
          in: query
          type: string
          required: false
          description: Full property address
        - name: city
          in: query
          type: string
          required: false
          description: City name
        - name: state
          in: query
          type: string
          required: false
          description: State code
        - name: zipCode
          in: query
          type: string
          required: false
          description: ZIP code
        - name: propertyType
          in: query
          type: string
          required: false
          description: Property type filter
        - name: bedrooms
          in: query
          type: string
          required: false
          description: Bedroom count filter
        - name: price
          in: query
          type: string
          required: false
          description: Rent price filter (supports ranges)
        - name: limit
          in: query
          type: integer
          required: false
          description: Results per page
        outputRawFormat: json
        outputParameters:
        - name: result
          type: array
          value: $.
    - name: markets
      path: /markets
      description: Aggregate real estate market statistics
      operations:
      - name: get-market-statistics
        method: GET
        description: Get aggregate market statistics for a zip code
        inputParameters:
        - name: zipCode
          in: query
          type: string
          required: false
          description: ZIP code for market data
        - name: state
          in: query
          type: string
          required: false
          description: State code
        - name: city
          in: query
          type: string
          required: false
          description: City name
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    port: 8080
    namespace: rentcast-research-api
    description: Unified REST API for RentCast property research and market analysis.
    resources:
    - path: /v1/properties
      name: properties
      description: US property record lookup and search
      operations:
      - method: GET
        name: search-properties
        description: Search property records by address or geographic area
        call: rentcast.search-properties
        with:
          address: rest.address
          city: rest.city
          state: rest.state
          zipCode: rest.zipCode
          latitude: rest.latitude
          longitude: rest.longitude
          radius: rest.radius
          propertyType: rest.propertyType
          limit: rest.limit
          offset: rest.offset
        outputParameters:
        - type: array
          mapping: $.
    - path: /v1/properties/{id}
      name: property
      description: Get a specific property record
      operations:
      - method: GET
        name: get-property
        description: Retrieve a property record by ID
        call: rentcast.get-property
        with:
          id: rest.id
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/estimates/rent
      name: rent-estimate
      description: Rent estimate via AVM
      operations:
      - method: GET
        name: get-rent-estimate
        description: Get an automated rent estimate for a property
        call: rentcast.get-rent-estimate
        with:
          address: rest.address
          propertyType: rest.propertyType
          bedrooms: rest.bedrooms
          bathrooms: rest.bathrooms
          squareFootage: rest.squareFootage
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/estimates/value
      name: value-estimate
      description: Home value estimate via AVM
      operations:
      - method: GET
        name: get-value-estimate
        description: Get an automated home value estimate for a property
        call: rentcast.get-value-estimate
        with:
          address: rest.address
          propertyType: rest.propertyType
          bedrooms: rest.bedrooms
          bathrooms: rest.bathrooms
          squareFootage: rest.squareFootage
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/listings/sale
      name: sale-listings
      description: For-sale property listings
      operations:
      - method: GET
        name: search-sale-listings
        description: Search for sale listings by location
        call: rentcast.search-sale-listings
        with:
          address: rest.address
          city: rest.city
          state: rest.state
          zipCode: rest.zipCode
          propertyType: rest.propertyType
          status: rest.status
          limit: rest.limit
        outputParameters:
        - type: array
          mapping: $.
    - path: /v1/listings/rental
      name: rental-listings
      description: Long-term rental listings
      operations:
      - method: GET
        name: search-rental-listings
        description: Search for rental listings by location
        call: rentcast.search-rental-listings
        with:
          address: rest.address
          city: rest.city
          state: rest.state
          zipCode: rest.zipCode
          propertyType: rest.propertyType
          bedrooms: rest.bedrooms
          price: rest.price
          limit: rest.limit
        outputParameters:
        - type: array
          mapping: $.
    - path: /v1/markets
      name: markets
      description: Real estate market statistics
      operations:
      - method: GET
        name: get-market-statistics
        description: Get aggregate market statistics for a zip code
        call: rentcast.get-market-statistics
        with:
          zipCode: rest.zipCode
          state: rest.state
          city: rest.city
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    port: 9080
    namespace: rentcast-research-mcp
    transport: http
    description: MCP server for AI-assisted real estate research and property analysis using RentCast data.
    tools:
    - name: search-properties
      description: Search US property records by address, city, state, zip code, or geographic coordinates
      hints:
        readOnly: true
        openWorld: true
      call: rentcast.search-properties
      with:
        address: tools.address
        city: tools.city
        state: tools.state
        zipCode: tools.zipCode
        latitude: tools.latitude
        longitude: tools.longitude
        radius: tools.radius
        propertyType: tools.propertyType
        limit: tools.limit
      outputParameters:
      - type: array
        mapping: $.
    - name: get-property
      description: Get detailed property record by RentCast property ID
      hints:
        readOnly: true
        openWorld: false
      call: rentcast.get-property
      with:
        id: tools.id
      outputParameters:
      - type: object
        mapping: $.
    - name: get-rent-estimate
      description: Get an automated rent estimate (AVM) for a property with comparable rentals
      hints:
        readOnly: true
        openWorld: true
      call: rentcast.get-rent-estimate
      with:
        address: tools.address
        propertyType: tools.propertyType
        bedrooms: tools.bedrooms
        bathrooms: tools.bathrooms
        squareFootage: tools.squareFootage
        compCount: tools.compCount
      outputParameters:
      - type: object
        mapping: $.
    - name: get-value-estimate
      description: Get an automated home value estimate (AVM) for a property with comparable sales
      hints:
        readOnly: true
        openWorld: true
      call: rentcast.get-value-estimate
      with:
        address: tools.address
        propertyType: tools.propertyType
        bedrooms: tools.bedrooms
        bathrooms: tools.bathrooms
        squareFootage: tools.squareFootage
        compCount: tools.compCount
      outputParameters:
      - type: object
        mapping: $.
    - name: search-sale-listings
      description: Search for active and historical sale listings by location or address
      hints:
        readOnly: true
        openWorld: true
      call: rentcast.search-sale-listings
      with:
        address: tools.address
        city: tools.city
        state: tools.state
        zipCode: tools.zipCode
        propertyType: tools.propertyType
        status: tools.status
        price: tools.price
        limit: tools.limit
      outputParameters:
      - type: array
        mapping: $.
    - name: search-rental-listings
      description: Search for long-term rental listings by location, address, or property criteria
      hints:
        readOnly: true
        openWorld: true
      call: rentcast.search-rental-listings
      with:
        address: tools.address
        city: tools.city
        state: tools.state
        zipCode: tools.zipCode
        propertyType: tools.propertyType
        bedrooms: tools.bedrooms
        price: tools.price
        limit: tools.limit
      outputParameters:
      - type: array
        mapping: $.
    - name: get-market-statistics
      description: Get aggregate real estate market statistics for a zip code including price trends and inventory
      hints:
        readOnly: true
        openWorld: true
      call: rentcast.get-market-statistics
      with:
        zipCode: tools.zipCode
        state: tools.state
        city: tools.city
      outputParameters:
      - type: object
        mapping: $.
