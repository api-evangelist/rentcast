          description: The year of construction, used to search for listings matching this criteria. Supports [numeric ranges](https://developers.rentcast.io/reference/search-queries#
        - name: status
          in: query
          type: string
          description: The current listing status, used to search for listings matching this criteria. See [explanation of
            listing statuses](https://developers.rentcast.io/reference/p
        - name: price
          in: query
          type: string
          description: The listed rent of the property, used to search for listings matching this criteria. Supports [numeric
            ranges](https://developers.rentcast.io/reference/search-q
        - name: daysOld
          in: query
          type: string
          description: The number of days since a property was listed on the market, with a minimum of 1. Supports [numeric
            ranges](https://developers.rentcast.io/reference/search-que
        - name: limit
          in: query
          type: integer
          description: The maximum number of listing records to return, between 1 and 500. Defaults to `50` if not provided.
            [Learn more](https://developers.rentcast.io/reference/pagi
        - name: offset
          in: query
          type: integer
          description: The index of the first listing record to return, used to paginate through large lists of results. Defaults
            to `0` if not provided. [Learn more](https://develope
        - name: includeTotalCount
          in: query
          type: boolean
          description: When enabled, will return the total number of results matching the current query in the `X-Total-Count`
            response header. Defaults to `false` if not provided
    - name: listings-rental-long-term-id
      path: /listings/rental/long-term/{id}
