      name: avm-rent-long-term
      description: REST surface for avm-rent-long-term.
      operations:
      - method: GET
        name: rentestimatelongterm
        description: Rent Estimate
        call: rentcast.rentestimatelongterm
        with:
          address: rest.address
          latitude: rest.latitude
          longitude: rest.longitude
          propertyType: rest.propertyType
          bedrooms: rest.bedrooms
          bathrooms: rest.bathrooms
          squareFootage: rest.squareFootage
          maxRadius: rest.maxRadius
          daysOld: rest.daysOld
          compCount: rest.compCount
          lookupSubjectAttributes: rest.lookupSubjectAttributes
        outputParameters:
