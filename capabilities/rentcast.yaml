naftiko: 1.0.0-alpha2
info:
  label: RentCast API
  description: 'RentCast API. 10 operations. Lead operation: Rent Estimate. Self-contained Naftiko capability covering one
    Rentcast business surface.'
  tags:
  - Rentcast
  - RentCast API
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    RENTCAST_API_KEY: RENTCAST_API_KEY
capability:
  consumes:
  - type: http
    namespace: rentcast
    baseUri: https://api.rentcast.io/v1
    description: RentCast API business capability. Self-contained, no shared references.
    resources:
    - name: avm-rent-long-term
      path: /avm/rent/long-term
      operations:
      - name: rentestimatelongterm
        method: GET
        description: Rent Estimate
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: address
          in: query
          type: string
          description: The **full address** of the property, in the format `Street, City, State, Zip`. You need to provide
            either the `address` or the `latitude`/`longitude` parameter
        - name: latitude
          in: query
          type: number
          description: The latitude of the property. The `latitude`/`longitude` can be provided instead of the `address` parameter
        - name: longitude
          in: query
          type: number
          description: The longitude of the property. The `latitude`/`longitude` can be provided instead of the `address`
            parameter
        - name: propertyType
          in: query
          type: string
          description: The type of the property. See [explanation of property types](https://developers.rentcast.io/reference/property-types)
        - name: bedrooms
          in: query
          type: number
          description: The number of bedrooms in the property. Use `0` to indicate a studio layout
        - name: bathrooms
          in: query
          type: number
          description: The number of bathrooms in the property. Supports fractions to indicate partial bathrooms
        - name: squareFootage
          in: query
          type: number
          description: The total living area size of the property, in square feet
        - name: maxRadius
          in: query
          type: number
          description: The maximum distance between comparable listings and the subject property, in miles
        - name: daysOld
          in: query
          type: integer
          description: The maximum number of days since comparable listings were last seen on the market, with a minimum of
            1
        - name: compCount
          in: query
          type: integer
          description: The number of comparable listings to use when calculating the rent estimate, between 5 and 25. Defaults
            to `15` if not provided
        - name: lookupSubjectAttributes
          in: query
          type: boolean
          description: When enabled, will attempt to look up subject property attributes to find more relevant comps. Defaults
            to `true` if not provided. [Learn more](https://develope
    - name: avm-value
      path: /avm/value
      operations:
      - name: valueestimate
        method: GET
        description: Value Estimate
        outputRawFormat: json
        outputParameters:
        - name: result
