aid: rentcast
name: RentCast
description: >-
  RentCast provides a real estate data API with instant access to over 140 million property records, automated valuation
  models (AVM) for home value and rent estimates, active and historical sale and rental listings, and aggregate real
  estate market statistics for US zip codes. The API enables real estate investors, property managers, landlords, and
  proptech applications to programmatically access comprehensive residential and commercial property data across all 50
  US states.
type: Index
